name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compila, roda os testes (JUnit 5 + jqwik) e gera o relatório JaCoCo
      - name: Build, testes e cobertura
        run: mvn -B verify

      - name: Resumo da cobertura no log
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 {im+=$4; ic+=$5; bm+=$6; bc+=$7} END {printf "Instruções cobertas: %d de %d\nRamos cobertos: %d de %d\n", ic, im+ic, bc, bm+bc}' target/site/jacoco/jacoco.csv
          fi

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
